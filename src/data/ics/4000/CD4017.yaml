partNumber: CD4017
series: '4000'
name: Decade Counter / Divider
description: >
  Johnson decade counter with 10 decoded outputs. A clock pulse advances the counter
  to the next state, producing a sequential HIGH output on Q0–Q9. Divide-by-10
  output available at CARRY OUT.
datasheetUrl: https://www.ti.com/lit/ds/symlink/cd4017b.pdf
