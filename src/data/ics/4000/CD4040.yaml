partNumber: CD4040
series: '4000'
name: 12-Stage Ripple Carry Binary Counter
description: >
  12-stage binary ripple carry counter with active-high master reset. Each rising
  clock edge advances the counter; Q1–Q12 provide binary-weighted outputs for
  frequency division (divide-by-2 through divide-by-4096).
datasheetUrl: https://www.ti.com/lit/ds/symlink/cd4040b.pdf
